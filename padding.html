<html>
    <head>
        <style>
            div{
                border:1px solid black;
                background-color: aqua;
                padding-top: 50px;
                padding-right: 50px;
                padding-bottom: 50px;
                padding-left: 80px;
            }
        </style>
    </head>
    <body>
        <h2>using individual padding properties</h2>
        <div>This div element has a padding of 50px on the top, right, and bottom, and 80px on the left.</div>
    </body>
    </html>
