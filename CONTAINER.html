<html>
<head>
    <style>
        .container {
            display: grid;
            grid-template-columns: 80px 200px auto;
            grid-template-rows: 100px 100px;
            background-color: dodgerblue;
            padding: 10px;
        }
        .container div {
            background-color: #f1f1f1;
            border: 1px solid black;
            padding: 10px;
            font-size: 30px;
        }
        .container1 {
            display: grid;
            grid-template-columns: 80px 200px auto;
            column-gap: 10px;
            row-gap: 10px;
            background-color: dodgerblue;
            padding: 10px;
        }
        .container1 div {
            background-color: #f1f1f1;
            border: 1px solid black;
            padding: 10px;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1>Grid Layout Example</h1>
    <p>Grid layout with 5 containers</p>
    <div class="container" align="center">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
</body>
