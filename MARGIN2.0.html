<html>
    <head>
        <style>
        div{
            border:1px solid black;
            margin: 100px;
            margin-bottom: 100px;
            margin-right: 50px;
            margin-left: 80px;
            background-color: aqua;
            width: 300px;
            margin:auto;
            border:1px  solid red;
        }
        </style>
    </head>
    <body>
        <h2>using individual margin properties</h2>
        <div>this div element has a top margin of 100px, a bottom margin of 100px, a right margin of 50px and a left margin of 80px.</div>
    </body> 
</html>
